<!DOCTYPE html>
<html lang="en">

<body>
    <div>
    <h1>B3 BANK</h1>
    <div class="container">
        <label for="name">NAME:</label>
        <input type="text" id="fullName"
         placeholder="ENTER YOUR NAME"><br>

         <label for="age">AGE:</label>
         <input type="number"  id="age"
          placeholder="ENTER YOUR AGE"><br>

          <label for="starting">ACCOUNT TYPE:</label>
          <input type="text" id="accountType"
          placeholder="ENTER ACCOUNT TYPE"><br>

          <label for="starting">STARTING BALANCE:</label>
          <input type="number" id="fbalance"
          placeholder="STARTING BALANCE"><br>

          <label for="deposit">DEPOSIT:</label>
          <input type="number"  id="deposit" placeholder="ENTER YOUR DEPOSIT AMOUNT"><br>

          <label for="withdrawal">WITHDRAWAL:</label>
          <input type="number" id="withdrawal"
           placeholder="ENTER YUOR WITHDRAWAL AMOUNT"> <br>

           <button id="btn">CREATE</button>

    </div> 

    <div class="dis">
        <h2 id="disName"></h2>
    <h2 id="disAge"></h2>
    <h2 id="disBalance"></h2>
    </div>
    </div>
